<div>
  <div nz-row>
    <h1 nz-card-grid [ngStyle]="gridStyle">Workout</h1>
  </div>

  <div nz-row>
    <div nz-col nzFlex="2">
      <nz-card nzType="inner" style="margin-top: 16px" nzTitle="Post new Workout">
        <form nz-form [formGroup]="workoutForm" class="custom-form" (ngSubmit)="submitForm()">
          <nz-form-item>
            <nz-form-control nzErrorTip="Please input the calories!">
              <input
                type="text"
                nz-input
                formControlName="caloriesBurned"
                placeholder="Enter the calories you burned"
              />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-control nzErrorTip="Please input the duration!">
              <input
                type="text"
                nz-input
                formControlName="duration"
                placeholder="Enter the duration"
              />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-control nzErrorTip="Please input the date!">
              <nz-date-picker style="width: 100%" formControlName="date"></nz-date-picker>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-control nzErrorTip="Please input the type!">
              <nz-select
                nzAllowClear
                nzPlaceHolder="Select the type of workout"
                formControlName="type"
              >
                <nz-option
                  *ngFor="let type of listOfType"
                  [nzValue]="type"
                  [nzLabel]="type"
                ></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
          <button nz-button nzType="primary" nzBlock [disabled]="workoutForm.invalid" class="w-100">
            Post Workout
          </button>
        </form>
      </nz-card>
    </div>
    <div nz-col nzFlex="3" style="margin-left: 20px">
      <nz-card nzType="inner" style="margin-top: 20px" nzTitle="Workout List">
        <div nz-card-grid style="width: 100%" *ngFor="let workout of workouts" class="workout-item">
          <div nz-col nzSpan="30">
            Calories Burned: <strong>{{ workout.caloriesBurned }}</strong> - Duration:
            <strong>{{ workout.duration }}</strong> - Date:
            <strong>{{ workout.date | date }}</strong> - Type: <strong>{{ workout.type }}</strong>
          </div>
        </div>
      </nz-card>
    </div>
  </div>
</div>
